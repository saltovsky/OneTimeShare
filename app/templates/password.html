{% extends "base.html" %}
{% block title %}Требуется пароль · OneTimeShare{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">

<div class="card bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm
            rounded-2xl shadow-xl shadow-slate-900/5 dark:shadow-black/30
            border border-slate-200/70 dark:border-slate-800/70
            p-8 sm:p-10 text-center">

    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl
                bg-gradient-to-br from-amber-400 to-orange-500
                shadow-lg shadow-amber-500/30 mb-5">
        <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
        data-i18n="password.title">Требуется пароль</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 mb-7"
       data-i18n="password.subtitle">Эта ссылка защищена. Введите пароль, чтобы получить файлы.</p>

    {% if error %}
    <div class="mb-5 flex items-start gap-3 p-3 text-left
                bg-rose-50 dark:bg-rose-950/30
                border border-rose-200 dark:border-rose-900/50 rounded-xl" role="alert">
        <svg class="w-4 h-4 text-rose-600 dark:text-rose-400 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p class="text-sm text-rose-800 dark:text-rose-200" data-i18n="password.wrong">Неверный пароль</p>
    </div>
    {% endif %}

    <form method="post" action="/d/{{ link_id }}/unlock" autocomplete="off">
        <label for="password" class="sr-only">Password</label>
        <input id="password" type="password" name="password" required autofocus
               data-i18n-placeholder="password.ph"
               placeholder="Введите пароль"
               class="input w-full px-3.5 py-3 text-center text-base
                      bg-white dark:bg-slate-900
                      border border-slate-300 dark:border-slate-700
                      text-slate-900 dark:text-slate-100
                      rounded-xl placeholder:text-slate-400 dark:placeholder:text-slate-500
                      focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400
                      focus:ring-2 focus:ring-indigo-500/20 dark:focus:ring-indigo-400/20">
        <button type="submit"
                class="btn w-full mt-4 bg-gradient-to-r from-indigo-600 to-violet-600
                       hover:from-indigo-500 hover:to-violet-500
                       text-white font-semibold py-2.5 px-4 rounded-xl
                       shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40
                       active:scale-[0.98] transition-all">
            <span data-i18n="password.unlock">Разблокировать</span>
        </button>
    </form>
</div>

</div>
{% endblock %}
